<html lang="en">

<head>

    form-action 'self' https://formspree.io;
    base-uri 'self';
    object-src 'none';

">

	<title>Page Not Found | ModeInfinity</title>
	<meta name="description" content="The page you are looking for could not be found. Return to ModeInfinity.">

<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111111">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

	<link rel="icon" href="public/favicon.ico" sizes="any">
	<link rel="apple-touch-icon" href="assets/images/logo.png">
	<link rel="manifest" href="public/manifest.json">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="styles/variables.css">
	<link rel="stylesheet" href="styles/global.css">
	<link rel="stylesheet" href="styles/layout.css">
	<link rel="stylesheet" href="styles/components.css">
	<link rel="stylesheet" href="styles/animations.css">
	<link rel="stylesheet" href="styles/responsive.css">
	<script src="scripts/theme-switcher.js"></script>
	<style>
		/* Specific styles for the Error Page */
	.error-hero {
	/* Local dark token scope — hero is always dark by design. */
	--color-text: #ffffff;
	--color-text-strong: #ffffff;
	--color-text-muted: rgb(255 255 255 / 0.82);
	--color-text-subtle: rgb(255 255 255 / 0.7);
	--color-text-inverse: #0a0a0a;
	--color-background: #000000;
	--color-surface: #111111;
	--color-border: rgb(255 255 255 / 0.12);
	--color-border-strong: rgb(255 255 255 / 0.35);
	--color-link: var(--color-gold-300);
	--color-link-hover: var(--color-gold-200);
	--color-accent-text: var(--color-gold-300);
	--color-interactive: var(--color-gold-300);
	--focus-ring-color: var(--color-gold-300);

	min-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
	text-align: center;
	background-color: var(--color-black-deep);
	color: var(--color-white);
	padding: calc(var(--header-height) + var(--space-8)) var(--container-padding-inline) var(--space-12);
	position: relative;
	overflow: hidden;
}
		
		.error-hero__inner {
			max-width: 48rem;
			margin-inline: auto;
			position: relative;
			z-index: 1;
		}

		.error-hero__code {
			font-family: var(--font-display);
			font-size: clamp(8rem, 20vw, 16rem);
			font-weight: var(--font-weight-semibold);
			line-height: 0.8;
			color: var(--color-gold-500);
			margin: 0 0 var(--space-4);
			letter-spacing: var(--tracking-tighter);
		}

		.error-hero__title {
			font-family: var(--font-display);
			font-size: clamp(2rem, 4vw, 3rem);
			color: var(--color-white);
			margin-bottom: var(--space-4);
			font-weight: var(--font-weight-semibold);
		}

		.error-hero__title em {
			color: var(--color-gold-300);
			font-style: italic;
		}

		.error-hero__desc {
			color: rgb(255 255 255 / 0.75);
			font-size: var(--text-base);
			line-height: var(--leading-relaxed);
			margin-bottom: var(--space-8);
			max-width: 36rem;
			margin-inline: auto;
		}

		.error-hero__actions {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			justify-content: center;
			gap: var(--space-4);
		}
	</style>
</head>

<body>

	<!-- Reuse the header for consistency -->
	<header class="site-header" data-site-header>
		<a class="skip-link" href="#main-content">Skip to main content</a>
		<div class="site-header__inner">
			<a class="site-brand" href="./" aria-label="ModeInfinity — home">
				<picture class="site-brand__picture">
					<source srcset="assets/images/logo.avif" type="image/avif">
					<source srcset="assets/images/logo.webp" type="image/webp">
					<img class="site-brand__logo" src="assets/images/logo.png" alt="ModeInfinity" width="200" height="56" loading="eager" decoding="async">
				</picture>
			</a>
			
			<div class="header-actions">
				<a href="./" class="btn btn-ghost" style="color: white;">Return Home</a>
			</div>
		</div>
	</header>

	<main id="main-content" class="site-main">
		<section class="error-hero" aria-labelledby="error-title">
			<div class="error-hero__inner">
				<h1 class="error-hero__code" id="error-title">404</h1>
				<h2 class="error-hero__title">This page has wandered <em>off the bench.</em></h2>
				<p class="error-hero__desc">
					The page you are looking for doesn't exist, has been moved, or is temporarily unavailable. 
					Let's get you back to the craft.
				</p>
				<div class="error-hero__actions">
					<a href="./" class="btn btn-primary btn--large">Back to Home</a>
					<a href="shop#collection" class="btn btn-secondary btn--large">Browse the Collection</a>
				</div>
			</div>
		</section>
	</main>

</body>
</html>
