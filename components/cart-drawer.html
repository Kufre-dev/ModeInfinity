<aside
  class="mi-cart"
  id="mi-cart"
  role="dialog"
  aria-modal="true"
  aria-labelledby="mi-cart-title"
  aria-hidden="true"
>
  <button
    class="mi-cart__backdrop"
    type="button"
    aria-label="Close cart"
    tabindex="-1"
    data-mi-cart-close
  ></button>

  <div class="mi-cart__panel">
    <header class="mi-cart__header">
      <div class="mi-cart__heading">
        <p class="mi-cart__eyebrow">Selected pairs</p>
        <h2 class="mi-cart__title" id="mi-cart-title">Your cart</h2>
      </div>

      <button
        class="mi-cart__close"
        type="button"
        aria-label="Close cart"
        data-mi-cart-close
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false">
          <path d="M5 5l14 14"></path>
          <path d="M19 5L5 19"></path>
        </svg>
      </button>
    </header>

    <div class="mi-cart__body">
      <p class="mi-cart__empty" data-mi-cart-empty>Your cart is empty. Add a pair to start an order.</p>
      <ul class="mi-cart__items" data-mi-cart-items></ul>
    </div>

    <footer class="mi-cart__footer">
      <div class="mi-cart__summary">
        <span>Subtotal</span>
        <strong data-mi-cart-subtotal>₦0</strong>
      </div>
      <button class="mi-cart__checkout" type="button" data-mi-cart-checkout>Checkout via WhatsApp</button>
      <button class="mi-cart__continue" type="button" data-mi-cart-close>Continue browsing</button>
    </footer>
  </div>
</aside>
