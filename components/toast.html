<!-- ============================================================
     MODEINFINITY — GLOBAL TOAST NOTIFICATION
     ============================================================

     Shared notification component.

     Used for:
     - Cart confirmations
     - Cart updates
     - Form submission feedback
     - Validation feedback
     - General application status messages

     Features:
     - Accessible live-region structure
     - Success, error, warning and information states
     - Dismiss control
     - Keyboard-friendly interaction
     - Screen-reader announcement support
     - Responsive positioning
     - No dependency on external libraries

     JavaScript:
     - scripts/main.js
     - scripts/formhandler.js
     - scripts/shop.js

     CSS:
     - styles/variables.css
     - styles/global.css
     - styles/components.css
     - styles/animations.css
     - styles/responsive.css

     Notes:
     - Toast messages should be created or updated dynamically.
     - Do not use color as the only way to communicate status.
     ============================================================ -->
<!-- ============================================================
     TOAST REGION
     ============================================================ -->
<div class="toast-region" id="toast-region" aria-label="Notifications">
  <!-- ==========================================================
       TOAST
       ========================================================== -->
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden>
    <!-- ========================================================
         TOAST ICON
         ======================================================== -->
    <div class="toast__icon" id="toast-icon" aria-hidden="true">
      <!--
        The icon is populated by JavaScript based on the
        notification type.

        Supported states:
        - success
        - error
        - warning
        - info
      -->
    </div>
    <!-- ========================================================
         TOAST CONTENT
         ======================================================== -->
    <div class="toast__content">
      <p class="toast__title" id="toast-title"> Notification </p>
      <p class="toast__message" id="toast-message"> Notification message. </p>
    </div>
    <!-- ========================================================
         TOAST DISMISS
         ======================================================== -->
    <button class="toast__close" id="toast-close" type="button" aria-label="Dismiss notification">
      <svg class="toast__close-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M5 5l14 14"></path>
        <path d="M19 5L5 19"></path>
      </svg>
    </button>
  </div>
</div>
