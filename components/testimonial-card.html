<!-- ============================================================
     MODEINFINITY — TESTIMONIAL CARD  (components/testimonial-card.html)
     ============================================================

     Reference template for one testimonial card.

     The homepage builds its cards in JavaScript
     (scripts/testimonials.js, function buildCard) using exactly this
     structure and these class names. If you change the card here,
     change buildCard there too.

     Data:   data/testimonials.json
     CSS:    styles/components.css (base card)
             styles/home-testimonials.css (photo badge, chips, location)

     Notes:
     - Write quotes without quotation marks; the CSS adds them.
     - rating, meta chips and location are optional.
     - The photo uses AVIF, then WebP, then JPG.
     - Paths have no leading slash so they work on GitHub Pages.
     ============================================================ -->
<article class="testimonial-card">

  <div class="testimonial-card__content">

    <!-- Optional rating -->
    <div class="testimonial-card__rating" role="img" aria-label="5 out of 5 stars">
      <span aria-hidden="true">★★★★★</span>
    </div>

    <!-- Quote -->
    <blockquote class="testimonial-card__quote">
      <p>The graduate's own words go here.</p>
    </blockquote>

    <!-- Optional chips: class year and programme -->
    <div class="testimonial-card__meta">
      <span class="testimonial-card__chip testimonial-card__chip--year">Class of YYYY</span>
      <span class="testimonial-card__chip">Programme name</span>
    </div>

  </div>

  <footer class="testimonial-card__author">

    <!-- Photo with a small gold badge -->
    <div class="testimonial-card__avatar-wrap">
      <div class="testimonial-card__avatar">
        <picture class="testimonial-card__picture">
          <source srcset="assets/images/testimonial/testimonial_1.avif" type="image/avif">
          <source srcset="assets/images/testimonial/testimonial_1.webp" type="image/webp">
          <img
            class="testimonial-card__image"
            src="assets/images/testimonial/testimonial_1.jpg"
            alt="Describe the person in the photo"
            width="64"
            height="64"
            loading="lazy"
            decoding="async"
          >
        </picture>
      </div>
      <span class="testimonial-card__badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </span>
    </div>

    <!-- Name, job title, location -->
    <div class="testimonial-card__author-info">
      <cite class="testimonial-card__name">Full name</cite>
      <span class="testimonial-card__role">Job title</span>
      <span class="testimonial-card__location">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        City, Country
      </span>
    </div>

  </footer>

</article>
